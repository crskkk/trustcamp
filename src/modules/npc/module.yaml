name: npc
description: >
  NPC spawner + motion policy + bridge publish loop. Uses the avatar
  generator (AGENTS §9 — same pipeline as players, no isNpc visual
  branch) and adds NPCs to the presence layer with a dedicated
  "npc-<seed>" playerId namespace. Default role is "prospect".
  Cap defaults to 8 to prevent runaway spawns. Task 0104 adds the
  pure motion policy (chooseInput) and the per-tick bridge.publish
  loop; the Unity NpcController (which wraps the player locomotion
  path) drives the bodies in the world.
version: 0.3.0
api: src/modules/npc/api.ts
depends_on: [avatar, presence, i18n]
