name: npc
description: >
  NPC spawner. Uses the avatar generator (AGENTS §9 — same pipeline as
  players, no isNpc visual branch) and adds NPCs to the presence layer
  with a dedicated "npc-<seed>" playerId namespace. Default role is
  "prospect"; camo + locomotion land in task 0104. Cap defaults to 8
  to prevent runaway spawns.
version: 0.2.0
api: src/modules/npc/api.ts
depends_on: [avatar, presence, i18n]
