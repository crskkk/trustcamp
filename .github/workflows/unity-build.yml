# Unity WebGL build + artifact.
#
# The main CI job cannot build Unity (no Editor on the runner), which is how the
# stripped-shader / missing-avatar regressions shipped unnoticed. This job fills
# that gap, but it needs a Unity licence, so it is OFF until you opt in:
#
#   1. Add repo secrets:
#        UNITY_LICENSE   – contents of a personal .ulf licence file
#        (or UNITY_EMAIL + UNITY_PASSWORD + UNITY_SERIAL for a Plus/Pro seat)
#   2. Add repo variable  UNITY_CI_ENABLED = true
#
# Until then the job resolves to "skipped" (green), never "failed".

name: Unity WebGL build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ["unity/**"]

jobs:
  webgl:
    runs-on: ubuntu-latest
    if: ${{ vars.UNITY_CI_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: unity/Library
          key: Library-WebGL-${{ hashFiles('unity/Assets/**', 'unity/Packages/**', 'unity/ProjectSettings/**') }}
          restore-keys: Library-WebGL-

      - name: Build WebGL player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: unity
          targetPlatform: WebGL
          unityVersion: 6000.5.10f1
          buildMethod: TrustCamp.EditorTools.BuildScript.BuildWebGL
          allowDirtyBuild: true

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: unity-webgl-build
          path: public/unity/Build
          if-no-files-found: error

      - name: Playwright (real build present)
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          npx playwright install --with-deps chromium
          pnpm test:e2e
